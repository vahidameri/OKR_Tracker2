server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html هرگز کش نشود؛ وگرنه پس از هر استقرار، مرورگر نسخهٔ قدیمی را
  # نگه می‌دارد و تغییرات دیده نمی‌شود.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }

  # نام فایل‌های assets هش دارد، پس کش طولانی‌مدت آن‌ها امن است.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
