<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="نشان دپارتمان فناوری و محصول">
  <defs>
    <linearGradient id="tile" x1="14" y1="4" x2="50" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A6EFD0"/>
      <stop offset="0.55" stop-color="#63D9AB"/>
      <stop offset="1" stop-color="#39C892"/>
    </linearGradient>
    <linearGradient id="gloss" x1="32" y1="4" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- کاشی -->
  <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#tile)"/>
  <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#gloss)"/>

  <!-- سه نقطه -->
  <g fill="#ffffff" stroke="#14201C" stroke-width="2.6">
    <circle cx="32" cy="22" r="5.2"/>
    <circle cx="21" cy="32.5" r="5.2"/>
    <circle cx="43" cy="32.5" r="5.2"/>
  </g>

  <!-- نوار موجی: یک مسیر بسته با ضخامت ثابت و سرهای صاف -->
  <path
    d="M13.5 40.5 L23 33 L32 40.5 L41 33 L50.5 40.5 L50.5 49 L41 41.5 L32 49 L23 41.5 L13.5 49 Z"
    fill="#F2C42B"
    stroke="#14201C"
    stroke-width="3"
    stroke-linejoin="round"
  />
</svg>
